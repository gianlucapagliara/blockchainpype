name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python
      run: uv python install 3.13
    - name: Install dependencies
      run: uv sync
    - name: Run ruff check
      run: uv run ruff check .
    - name: Run ruff format check
      run: uv run ruff format --check .
    - name: Run mypy
      run: uv run mypy --strict blockchainpype/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync
    - name: Run tests with coverage
      # Test selection (skips network/integration tests) comes from addopts in
      # pyproject.toml — the single source of truth shared with `make test`.
      run: uv run pytest --cov=blockchainpype --cov-report=xml --cov-fail-under=80
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: gianlucapagliara/blockchainpype

  integration:
    name: Integration (Hardhat)
    runs-on: ubuntu-latest
    needs: lint
    # Non-blocking: the hardhat suite needs a local node and npm toolchain;
    # failures here should not gate merges.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python
      run: uv python install 3.13
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: common/hardhat/package-lock.json
    - name: Install dependencies
      run: uv sync
    - name: Install Hardhat dependencies
      working-directory: common/hardhat
      run: npm ci
    - name: Run Hardhat integration tests
      run: uv run pytest tests/evm/test_hardhat.py -m "" --timeout=300
